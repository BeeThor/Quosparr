<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">Quosparr sparrow logo</title>
  <desc id="desc">A softly sculpted chestnut sparrow with an apricot belly and an open Q-shaped wing cut from negative space.</desc>
  <defs>
    <linearGradient id="chestnut" x1="109" y1="42" x2="212" y2="147" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DE8244"/>
      <stop offset="0.4" stop-color="#B3582D"/>
      <stop offset="1" stop-color="#91401F"/>
    </linearGradient>
    <linearGradient id="apricot" x1="103" y1="115" x2="173" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC575"/>
      <stop offset="0.5" stop-color="#EBA650"/>
      <stop offset="1" stop-color="#CE8139"/>
    </linearGradient>
    <radialGradient id="wing-light" cx="116" cy="118" r="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE0A2" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFE0A2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beak-shade" x1="212" y1="76" x2="229" y2="103" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#70503B"/>
      <stop offset="0.55" stop-color="#553C30"/>
      <stop offset="1" stop-color="#463026"/>
    </linearGradient>
    <path id="bird-body" d="M23 85L86 117C101 102 109 78 120 60C133 41 156 35 178 41C198 47 211 62 212 76L212 102C210 130 202 153 181 173C164 189 138 197 108 194C83 192 62 178 49 156L22 164L39 134Z"/>
    <clipPath id="body-clip">
      <use href="#bird-body"/>
    </clipPath>
    <mask id="negative-space" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#FFFFFF"/>
      <circle cx="176" cy="66" r="9" fill="#000000"/>
      <path d="M95 125C109 111 129 104 149 106C165 108 173 119 172 133C170 147 157 157 141 162C130 165 119 165 114 163C124 163 134 161 143 157C156 153 166 144 167 133C169 122 161 113 148 111C130 109 111 115 95 125Z" fill="#000000"/>
      <path d="M153 151L190 181L185 187L148 156Z" fill="#000000"/>
    </mask>
  </defs>
  <g id="symbol">
    <g mask="url(#negative-space)">
      <use href="#bird-body" fill="url(#apricot)"/>
      <use href="#bird-body" fill="url(#wing-light)"/>
      <path d="M23 85L86 117C101 102 109 78 120 60C133 41 156 35 178 41C198 47 211 62 212 76L212 102C211 118 208 134 203 147C195 133 183 123 172 119C166 110 159 107 149 106C129 104 109 111 95 125C77 139 66 155 62 172L45 158L22 164L39 134Z" fill="url(#chestnut)" clip-path="url(#body-clip)"/>
    </g>
    <path d="M212 76L235 92L212 102Z" fill="url(#beak-shade)"/>
  </g>
</svg>
